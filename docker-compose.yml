services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    image: nawba-api:local
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      LOADTEST_ACCOUNTS: ${LOADTEST_ACCOUNTS:-0}
      NAWBA_RULES: /config/clinical_rules.yaml
    volumes: [./config:/config:ro, ./data:/data:ro]
    depends_on:
      db: {condition: service_healthy}

  web:
    build: ./frontend
    image: nawba-web:local
    ports: ["8443:443", "8080:80"]
    environment:
      TLS_EXTRA_SAN: ${TLS_EXTRA_SAN:-}
    volumes: [./certs:/etc/nginx/certs]   # stable self-signed certificate (trust it once, docs/DEMO_DAY.md)
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 10s
      retries: 5

volumes:
  dbdata:
