server {
  listen 80;
  location / { return 301 https://$host:8443$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  client_max_body_size 1m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
  }
  # `expires` (not add_header) so the security headers above are still inherited.
  # Hashed bundles never change -> cache forever; a missing bundle is a real 404, never index.html.
  location /assets/ { expires max; try_files $uri =404; }
  location = /sw.js { expires -1; }
  location = /clinic { expires -1; try_files /clinic.html =404; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
